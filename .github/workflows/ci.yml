name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            early-access-api/package-lock.json
      - name: Install app dependencies
        run: npm ci --prefix app
      - name: Install API dependencies
        run: npm ci --prefix early-access-api
      - name: Type-check and build public pages
        run: npm run build
      - name: Check API syntax
        run: npm run check:api
      - name: Test public routes and API boundaries
        run: npm test
